services:
  web:
    build: .
    restart: unless-stopped
    networks:
      - cloudflared_tunnel_net
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=cloudflared_tunnel_net"
      - "traefik.http.routers.mcjelly.rule=Host(`mcjelly.hijoushoku.com`)"
      - "traefik.http.routers.mcjelly.entrypoints=web"
      - "traefik.http.services.mcjelly.loadbalancer.server.port=80"

networks:
  cloudflared_tunnel_net:
    external: true
